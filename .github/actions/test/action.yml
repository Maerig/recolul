name: Run Tests

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        cache: 'pip'
        cache-dependency-path: |
          pyproject.toml
          setup.cfg

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run tests
      shell: bash
      run: pytest -v
